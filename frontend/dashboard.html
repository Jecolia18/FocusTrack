<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h1>Focus Track</h1>
            <img src="assets/utilisateur.png" alt="user"/>
        </aside>
        <main class="main-panel">
            <div class="first_element">
                <h1>Welcome back</h1>
                <h2>Today's goal:</h2>
                <div class="box second">
                    <label class="checkbox">
                        <input type="checkbox"/>Start a new study session
                        <button class="arrow-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M13.1717 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1717 12.0007Z"></path></svg></button>
                    </label>
                </div>
                <div class="box first">
                    <h2>Select your curent mood:</h2>
                    <button class="arrow-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M13.1717 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1717 12.0007Z"></path></svg>
                    </button>
                </div>
                <div class="box first">
                    <h2>Select your curent mood:</h2>
                    <p>just some random text</p>
                    <button class="arrow-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M13.1717 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1717 12.0007Z"></path></svg>
                    </button>
                </div>
            </div>
            <div id="second_element">
                <div class="focus-time">
                    <h3>Focus time</h3>
                    <h4>10:30</h4>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
